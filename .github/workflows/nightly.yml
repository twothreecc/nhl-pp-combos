name: Nightly refresh

on:
  schedule:
    # 11:00 UTC = 6 a.m. EST / 7 a.m. EDT (most of the regular season is on EST)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw API responses (~400 MB by season's end) are too big to commit, so they live in the
      # Actions cache. Each run restores the newest cache and saves a fresh one; if it's ever
      # evicted, the pipeline simply re-fetches everything.
      - name: Restore raw cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Run pipeline
        run: python pipeline/run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898689+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json site/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Nightly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
